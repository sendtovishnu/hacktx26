# Render Blueprint for the API server: New > Blueprint > pick this repo.
# Render asks for each sync:false value once; paste them from server/.env.
services:
  - type: web
    name: hacktx26-twin
    runtime: node
    rootDir: server
    # Free instances sleep when idle and take ~50s to wake; starter stays up for the demo.
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: USE_MOCKS
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: META_API_BASE_URL
        value: https://api.meta.ai/v1
      - key: META_MODEL
        value: muse-spark-1.3
      - key: DEMO_LOCATION
        value: PCL Library, UT Austin
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: META_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_WEB_CLIENT_SECRET
        sync: false
